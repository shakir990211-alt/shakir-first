
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZOhair | Cyber Terminal</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: #020504;
    color: #00ff66;
    font-family: 'Share Tech Mono', monospace;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

canvas {
    position: fixed;
    inset: 0;
    z-index: 0;
    opacity: 0.25;
}

.scanlines {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background: repeating-linear-gradient(
        transparent 0px,
        rgba(0,255,100,0.035) 2px,
        transparent 4px
    );
}

.container {
    position: relative;
    z-index: 3;
    text-align: center;
    padding: 35px 20px;
    width: min(90%, 700px);
    border: 1px solid #00ff6650;
    background: rgba(0, 15, 7, 0.82);
    box-shadow: 0 0 35px #00ff6615,
                inset 0 0 30px #00ff6608;
}

.status {
    color: #ff3030;
    letter-spacing: 4px;
    font-size: 12px;
    margin-bottom: 28px;
    animation: blink 1s infinite;
}

h1 {
    position: relative;
    font-size: clamp(30px, 7vw, 64px);
    letter-spacing: 3px;
    text-shadow: 0 0 10px #00ff66,
                 0 0 30px #00ff6680;
    animation: flicker 4s infinite;
}

.subtitle {
    margin-top: 18px;
    color: #80ffad;
    letter-spacing: 3px;
    font-size: 13px;
}

.terminal {
    margin-top: 38px;
    padding: 20px;
    border: 1px solid #00ff6630;
    text-align: left;
    color: #00ff66;
    font-size: 13px;
    line-height: 2;
    min-height: 150px;
}

.prompt {
    color: #ffffff;
}

.cursor {
    display: inline-block;
    width: 8px;
    height: 15px;
    background: #00ff66;
    vertical-align: middle;
    animation: blink .7s infinite;
}

.footer {
    margin-top: 28px;
    font-size: 11px;
    color: #477b58;
    letter-spacing: 2px;
}

@keyframes blink {
    50% { opacity: 0; }
}

@keyframes flicker {
    0%, 95%, 100% { opacity: 1; }
    96% { opacity: .6; }
    97% { opacity: 1; }
    98% { opacity: .8; }
}

@media (max-width: 480px) {
    .container { padding: 25px 14px; }
    .terminal { font-size: 11px; }
}
</style>
</head>

<body>

<canvas id="matrix"></canvas>
<div class="scanlines"></div>

<main class="container">
    <div class="status">● SYSTEM ONLINE // ACCESS GRANTED</div>

    <h1>ZOhair HIJACKED</h1>

    <p class="subtitle">WELCOME TO THE DARK SIDE</p>

    <div class="terminal">
        <div><span class="prompt">root@zohair:~$</span> initializing system...</div>
        <div id="line1"></div>
        <div id="line2"></div>
        <div id="line3"></div>
        <div><span class="prompt">root@zohair:~$</span> <span class="cursor"></span></div>
    </div>

    <div class="footer">
        [ ZOHAIR TERMINAL ] — CYBER MODE ACTIVATED
    </div>
</main>

<script>
// Matrix-style falling characters
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

let columns = 0;
let drops = [];

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    columns = Math.floor(canvas.width / 18);
    drops = Array(columns).fill(1);
}

resize();
window.addEventListener("resize", resize);

const chars = "01ABCDEFGHIJKLMNOPQRSTUVWXYZ#$%";

function drawMatrix() {
    ctx.fillStyle = "rgba(2, 5, 4, 0.09)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#00ff66";
    ctx.font = "15px monospace";

    for (let i = 0; i < drops.length; i++) {
        const char = chars[Math.floor(Math.random() * chars.length)];
        ctx.fillText(char, i * 18, drops[i] * 18);

        if (drops[i] * 18 > canvas.height && Math.random() > 0.975) {
            drops[i] = 0;
        }
        drops[i]++;
    }
}

setInterval(drawMatrix, 45);

// Terminal typing effect
const messages = [
    ["line1", "> Establishing secure connection..."],
    ["line2", "> Identity: ZOhair // VERIFIED"],
    ["line3", "> Cyber interface loaded successfully."]
];

let index = 0;

function typeLine() {
    if (index >= messages.length) return;

    const [id, text] = messages[index];
    const element = document.getElementById(id);
    let charIndex = 0;

    function typeChar() {
        if (charIndex < text.length) {
            element.textContent += text.charAt(charIndex);
            charIndex++;
            setTimeout(typeChar, 35);
        } else {
            index++;
            setTimeout(typeLine, 400);
        }
    }

    typeChar();
}

setTimeout(typeLine, 700);
</script>

</body>
</html>
